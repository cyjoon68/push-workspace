services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: push
      POSTGRES_USER: push
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U push -d push]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./push-be
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://push:${POSTGRES_PASSWORD}@postgres:5432/push?sslmode=disable
      APP_ENV: production
      LISTEN_ADDR: ':8080'
    depends_on:
      postgres:
        condition: service_healthy
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
