<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Push — applications-default</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
</head>
<body>
<main class="screen">
<aside class="sidebar">
<div class="sidebar-head"><span class="t-label">Push</span><button class="icon-button"><svg class="icon" data-icon="panel-left-close" width="20" height="20"><use href="../icons.svg#i-panel-left-close"/></svg></button></div>
<div class="sidebar-section"><div class="sidebar-label">채팅</div>
<button class="sidebar-item"><svg class="icon" data-icon="square-pen" width="20" height="20"><use href="../icons.svg#i-square-pen"/></svg><span class="sidebar-item-label">새 채팅</span></button><button class="sidebar-item"><span class="sidebar-dot is-on"></span><span class="sidebar-item-label">삼성전자</span></button><button class="sidebar-item"><span class="sidebar-item-label">네이버</span></button><button class="sidebar-item"><span class="sidebar-dot is-busy"></span><span class="sidebar-item-label">Kafka 파이프라인</span><span class="sidebar-tag">프로젝트</span></button></div>
<div class="sidebar-section"><div class="sidebar-label">기능</div>
<button class="sidebar-item"><svg class="icon" data-icon="file-text" width="20" height="20"><use href="../icons.svg#i-file-text"/></svg><span class="sidebar-item-label">내 서류</span></button><button class="sidebar-item is-active"><svg class="icon" data-icon="briefcase" width="20" height="20"><use href="../icons.svg#i-briefcase"/></svg><span class="sidebar-item-label">지원 관리</span></button><button class="sidebar-item"><svg class="icon" data-icon="archive" width="20" height="20"><use href="../icons.svg#i-archive"/></svg><span class="sidebar-item-label">커리어 볼트</span></button><button class="sidebar-item"><svg class="icon" data-icon="mic" width="20" height="20"><use href="../icons.svg#i-mic"/></svg><span class="sidebar-item-label">면접</span></button><button class="sidebar-item"><svg class="icon" data-icon="calendar" width="20" height="20"><use href="../icons.svg#i-calendar"/></svg><span class="sidebar-item-label">캘린더</span></button></div>
<div class="sidebar-foot"><button class="sidebar-item"><svg class="icon" data-icon="settings" width="20" height="20"><use href="../icons.svg#i-settings"/></svg><span class="sidebar-item-label">설정</span></button></div>
</aside><div class="canvas"><div class="canvas-header"><h1 class="canvas-header-title">지원 관리</h1><div class="canvas-header-actions"><button class="button button-primary button-sm"><svg class="icon" data-icon="plus" width="20" height="20"><use href="../icons.svg#i-plus"/></svg> 공고 추가</button></div></div><div class="canvas-body"><div class="card-grid">
<div class="card"><div class="card-title">삼성전자 백엔드</div><div class="card-meta">자소서 작성 중</div><span class="status-chip status-chip-ready">READY</span></div>
<div class="card"><div class="card-title">네이버 프론트엔드</div><div class="card-meta">지원 완료</div><span class="status-chip status-chip-verified">SUBMITTED</span></div>
<div class="card"><div class="card-title">카카오 플랫폼</div><div class="card-meta">공고 분석 중</div><span class="status-chip status-chip-pending">ANALYZING</span></div>
</div></div><div class="toast"><svg class="icon" data-icon="check" width="16" height="16"><use href="../icons.svg#i-check"/></svg> 상태가 업데이트됐어요</div></div>
</main>
</body>
</html>
