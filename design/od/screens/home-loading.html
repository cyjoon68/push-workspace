<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Push — home-loading</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
</head>
<body>
<main class="screen">
<aside class="sidebar">
<div class="sidebar-head"><span class="t-label">Push</span><button class="icon-button"><svg class="icon" data-icon="panel-left-close" width="20" height="20"><use href="../icons.svg#i-panel-left-close"/></svg></button></div>
<div class="sidebar-section"><div class="sidebar-label">채팅</div>
<button class="sidebar-item"><svg class="icon" data-icon="square-pen" width="20" height="20"><use href="../icons.svg#i-square-pen"/></svg><span class="sidebar-item-label">새 채팅</span></button><button class="sidebar-item"><span class="sidebar-dot is-on"></span><span class="sidebar-item-label">삼성전자</span></button><button class="sidebar-item"><span class="sidebar-item-label">네이버</span></button><button class="sidebar-item"><span class="sidebar-dot is-busy"></span><span class="sidebar-item-label">Kafka 파이프라인</span><span class="sidebar-tag">프로젝트</span></button></div>
<div class="sidebar-section"><div class="sidebar-label">기능</div>
<button class="sidebar-item"><svg class="icon" data-icon="file-text" width="20" height="20"><use href="../icons.svg#i-file-text"/></svg><span class="sidebar-item-label">내 서류</span></button><button class="sidebar-item"><svg class="icon" data-icon="briefcase" width="20" height="20"><use href="../icons.svg#i-briefcase"/></svg><span class="sidebar-item-label">지원 관리</span></button><button class="sidebar-item"><svg class="icon" data-icon="archive" width="20" height="20"><use href="../icons.svg#i-archive"/></svg><span class="sidebar-item-label">커리어 볼트</span></button><button class="sidebar-item"><svg class="icon" data-icon="mic" width="20" height="20"><use href="../icons.svg#i-mic"/></svg><span class="sidebar-item-label">면접</span></button><button class="sidebar-item"><svg class="icon" data-icon="calendar" width="20" height="20"><use href="../icons.svg#i-calendar"/></svg><span class="sidebar-item-label">캘린더</span></button></div>
<div class="sidebar-foot"><button class="sidebar-item"><svg class="icon" data-icon="settings" width="20" height="20"><use href="../icons.svg#i-settings"/></svg><span class="sidebar-item-label">설정</span></button></div>
</aside><div class="canvas"><div class="canvas-body"><div class="center">
<h1 class="t-display">무엇을 도와드릴까요?</h1>
<div class="command-input">
<button class="icon-button"><svg class="icon" data-icon="paperclip" width="20" height="20"><use href="../icons.svg#i-paperclip"/></svg></button>
<input class="command-input-field" placeholder="공고 URL을 붙여넣거나, 명령을 입력하세요">
<button class="button button-primary button-md">실행 <svg class="icon" data-icon="corner-down-left" width="16" height="16"><use href="../icons.svg#i-corner-down-left"/></svg></button>
</div>
<div class="suggest-chips">
<button class="suggest-chips-item">지원 현황 정리해줘</button>
<button class="suggest-chips-item">이력서 초안 써줘</button>
<button class="suggest-chips-item">면접 질문 뽑아줘</button>
</div></div>
<div class="canvas-header"><h2 class="canvas-header-title">최근 작업</h2></div>
<div class="card-grid"><div class="skeleton" style="height:96px"></div><div class="skeleton" style="height:96px"></div><div class="skeleton" style="height:96px"></div></div></div></div>
</main>
</body>
</html>
