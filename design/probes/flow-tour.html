<meta charset="utf-8"><title>2단계 플로우 — 따라가 보기</title>
<style>
:root{color-scheme:light only;
  --bg:#F7F8FA;--card:#FFFFFF;--line:#E5E7EB;--ink:#1F2937;--sub:#6B7280;--soft:#EEF0F3;
  --acc:#2F6BFF;--acc-d:#1F4ED8;--danger:#DC2626;--frame-w:1440px}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:14px/1.5 "Pretendard",-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.wrap{max-width:1320px;margin:0 auto;padding:20px 24px 72px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--sub);margin:0 0 18px}
.scen-tabs{display:flex;gap:6px;margin-bottom:18px}
.stab{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--sub);padding:8px 16px;border-radius:10px;cursor:pointer}
.stab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.stage{display:grid;grid-template-columns:132px minmax(0,1fr) 340px;gap:24px;align-items:start}
.strip{position:sticky;top:12px;display:flex;flex-direction:column;gap:10px}
.strip .pager{display:flex;gap:6px}
.strip .pager button{flex:1;font:inherit;font-size:16px;height:40px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer}
.strip .pager button:disabled{opacity:.35;cursor:default}
.strip .pos{font-size:13px;font-weight:700;color:var(--sub);text-align:center}
.strip .dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.strip .dots i{width:8px;height:8px;border-radius:50%;background:#D1D5DB}
.strip .dots i.on{background:var(--acc)}
.strip .dots i.marked{background:#F59E0B}
.strip .save{font:inherit;font-weight:700;font-size:14px;height:40px;width:100%;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
.strip .save:disabled{opacity:.5;cursor:default}
.strip .saved{font-size:12px;font-weight:600;color:#166534;text-align:center;min-height:18px}

/* 데스크톱 창 프레임 */
.win{position:relative;width:100%;max-width:860px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 8px 28px rgba(17,24,39,.08)}
.titlebar{height:36px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#F3F4F6;border-bottom:1px solid var(--line)}
.titlebar i{width:11px;height:11px;border-radius:50%}
.titlebar i:nth-child(1){background:#FF5F57}.titlebar i:nth-child(2){background:#FEBC2E}.titlebar i:nth-child(3){background:#28C840}
.titlebar span{margin-left:8px;font-size:12px;color:var(--sub)}
.winbody{display:grid;grid-template-columns:188px minmax(0,1fr);height:520px}
.sb{border-right:1px solid var(--line);background:#FAFAFB;padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.sb .sec{font-size:11px;font-weight:700;color:#9CA3AF;padding:8px 8px 4px;letter-spacing:.04em}
.sb .it{font-size:13px;padding:6px 10px;border-radius:8px;color:var(--ink);display:flex;align-items:center;gap:8px}
.sb .it.on{background:#EEF3FF;color:var(--acc);font-weight:600}
.sb .it .dot{width:6px;height:6px;border-radius:50%;background:#C7CBD1}
.canvas{padding:18px 22px;overflow:hidden;position:relative}
.badge{position:absolute;width:22px;height:22px;border-radius:50%;background:rgba(47,107,255,.92);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;z-index:6}

/* 화면 요소 */
.h-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.h-title{font-size:18px;font-weight:700}
.cmd{border:2px solid var(--line);border-radius:14px;padding:16px;font-size:15px;color:var(--sub);background:#fff}
.cmd.filled{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;font:inherit;font-weight:700;font-size:14px;height:40px;padding:0 18px;border-radius:10px;border:0;background:var(--acc);color:#fff;cursor:pointer}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--acc)}
.btn:disabled{opacity:.5}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.card .t{font-weight:700;margin-bottom:4px}
.card .d{font-size:13px;color:var(--sub)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--sub);margin:2px 4px 2px 0}
.chip.acc{background:#EEF3FF;color:var(--acc)}
.chip.warn{background:#FEF3C7;color:#92400E}
.chip.ok{background:#D1FAE5;color:#065F46}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--soft);font-size:14px}
.row:last-child{border-bottom:0}
.msg{max-width:80%;padding:10px 14px;border-radius:14px;margin-bottom:10px;font-size:14px}
.msg.ai{background:var(--soft)}
.msg.me{background:var(--acc);color:#fff;margin-left:auto}
.chatinput{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--sub);display:flex;justify-content:space-between;align-items:center}
.docline{height:11px;border-radius:6px;background:#E9EBEF;margin:10px 0}
.docline.w60{width:60%}.docline.w80{width:80%}.docline.w45{width:45%}
.sel{background:#DBEAFE;border-radius:4px;padding:1px 3px;font-size:14px}
.bubble{display:inline-flex;gap:6px;background:var(--ink);color:#fff;border-radius:10px;padding:6px 8px;font-size:12px}
.bubble span{padding:2px 8px;border-radius:6px;cursor:pointer}
.bubble span:hover{background:#374151}
.approval{border:2px solid var(--acc);border-radius:12px;padding:14px 16px;background:#F8FAFF}
.approval .h{font-weight:700;color:var(--acc);margin-bottom:6px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:#F3F4F6;border-radius:8px;padding:8px 10px;color:#374151;white-space:pre-wrap}
.empty{color:var(--sub);text-align:center;padding:48px 0;font-size:14px}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,#EEF0F3,#E2E5EA,#EEF0F3);margin:12px 0;animation:sk 1.2s infinite}
@keyframes sk{0%{opacity:.6}50%{opacity:1}100%{opacity:.6}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,107,255,.45)}70%{box-shadow:0 0 0 10px rgba(47,107,255,0)}100%{box-shadow:0 0 0 0 rgba(47,107,255,0)}}
.hot{outline:3px solid var(--acc)!important;outline-offset:2px;animation:pulse 1.6s infinite;cursor:pointer;position:relative;z-index:5}
.cue{position:absolute;left:-148px;transform:translateY(-50%);background:var(--acc);color:#fff;font-size:12px;font-weight:700;padding:6px 12px;border-radius:10px;white-space:nowrap;z-index:7}
.cue::after{content:"";position:absolute;right:-6px;top:50%;transform:translateY(-50%);border:6px solid transparent;border-left-color:var(--acc)}

/* 오른쪽 패널 */
.panel{display:flex;flex-direction:column;gap:14px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.pcard .eyebrow{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--sub);text-transform:uppercase;margin-bottom:8px}
.pcard p{margin:0;font-size:14px}
.areas{list-style:none;margin:0;padding:0;font-size:14px}
.areas li{padding:3px 0}
.areas b{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;align-items:center;justify-content:center;margin-right:8px}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
.chiprow .c{background:var(--soft);border-radius:8px;padding:4px 10px}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.seg button{font:inherit;font-size:12px;font-weight:600;padding:5px 10px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--sub)}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg button:disabled{opacity:.35;cursor:default}
.fbbtns{display:flex;gap:8px}
.fbb{flex:1;font:inherit;font-weight:700;font-size:14px;height:40px;border-radius:10px;cursor:pointer;border:1px solid var(--line);background:#fff}
.fbb.good{background:var(--acc);border-color:var(--acc);color:#fff}
.fbb.hmm.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.marks{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.marks button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer}
.marks button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
textarea{width:100%;font:inherit;font-size:14px;line-height:1.5;padding:10px 12px;border:1px solid var(--line);border-radius:10px;resize:vertical;min-height:64px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);padding:8px 16px;border-radius:18px;background:var(--ink);color:#fff;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.gaze{position:absolute;inset:0;pointer-events:none;z-index:4}
.gaze i{position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;border:2px dashed var(--acc);color:var(--acc);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.overall{margin-top:40px;display:grid;grid-template-columns:132px minmax(0,1fr);gap:24px;align-items:start}
.overall .fb{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
@media (max-width:1100px){.stage{grid-template-columns:1fr}.strip{position:static;flex-direction:row;flex-wrap:wrap;align-items:center}}
@media (prefers-reduced-motion:reduce){.hot{animation:none}.toast{transition:none}}
</style>

<div class="wrap">
<h1>2단계 플로우 — 따라가 보기 <span class="sub" id="h-count"></span></h1>
<p class="sub">핵심 작업을 처음부터 끝까지 눌러보는 투어예요. 파란 테두리만 누르면 다음 장면으로 넘어가요.</p>
<div class="scen-tabs" id="scen-tabs"></div>
<div class="stage">
  <div class="strip">
    <div class="pager"><button id="prev">‹</button><button id="next">›</button></div>
    <div class="pos" id="pos"></div>
    <div class="dots" id="dots"></div>
    <button class="save" id="save" disabled>저장</button>
    <div class="saved" id="saved"></div>
  </div>
  <div>
    <h2 id="scene-title" style="font-size:17px;margin:0 0 4px"></h2>
    <p class="sub" id="scene-story" style="margin-bottom:14px"></p>
    <div class="win" id="win"></div>
  </div>
  <div class="panel">
    <div class="pcard"><div class="eyebrow">지금 상황</div><p id="p-now"></p></div>
    <div class="pcard"><div class="eyebrow">화면 구성</div><ul class="areas" id="p-areas"></ul></div>
    <div class="pcard"><div class="eyebrow">누르면 이렇게 돼요</div><div class="chiprow" id="p-chips"></div><div class="seg" id="p-seg"></div></div>
    <div class="pcard"><div class="eyebrow">시선 흐름</div><p id="p-gaze"></p><button class="btn sec" id="gaze-toggle" style="height:32px;font-size:12px;margin-top:8px">흐름 화살표 보기</button></div>
    <div class="pcard"><div class="eyebrow">이 장면, 어때요?</div>
      <div class="fbbtns"><button class="fbb good" id="fb-good">괜찮아요 👍</button><button class="fbb hmm" id="fb-hmm">어색해요 🤔</button></div>
      <div id="fb-detail" hidden>
        <div class="marks" id="fb-marks"></div>
        <textarea id="fb-text" placeholder="어디가 어색한지 적어 주세요"></textarea>
      </div>
    </div>
  </div>
</div>
<div class="overall">
  <div class="strip" style="position:static">
    <button class="save" id="ov-save">저장</button>
    <div class="saved" id="ov-saved"></div>
  </div>
  <div class="fb"><div class="eyebrow" style="font-size:12px;font-weight:700;color:var(--sub);margin-bottom:8px">전체 의견</div><textarea id="ov-text" placeholder="투어 전체에 대해 하고 싶은 말"></textarea></div>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ 공통 프레임 ============ */
const SIDEBAR=(on)=>`
<div class="sb">
  <div class="sec">기능</div>
  ${["내 서류","지원 관리","커리어 볼트","면접","캘린더","오퍼","반복 작업"].map(n=>`<div class="it${on===n?' on':''}"><i class="dot"></i>${n}</div>`).join("")}
  <div class="sec">채팅</div>
  ${["카카오 · 백엔드","네이버 · 플랫폼"].map(n=>`<div class="it${on===n?' on':''}"><i class="dot"></i>${n}</div>`).join("")}
  <div class="it${on==='Kafka 파이프라인'?' on':''}"><i class="dot" style="border-radius:2px"></i>Kafka 파이프라인<span style="margin-left:auto;font-size:10px;color:var(--sub)">프로젝트</span></div>
  <div style="flex:1"></div>
  <div class="it${on==='설정'?' on':''}"><i class="dot"></i>설정</div>
</div>`;
const WIN=(side,title,body)=>`
<div class="titlebar"><i></i><i></i><i></i><span>Push — ${title}</span></div>
<div class="winbody">${SIDEBAR(side)}<div class="canvas">${body}</div></div>`;

/* ============ 화면 본문 ============ */
const B={};
B.home=(st)=>st==='loading'
 ? `<div class="h-row"><div class="h-title">무엇을 도와드릴까요?</div></div>
    <div class="cmd filled" style="display:flex;align-items:center;gap:10px">https://careers.kakao.com/jobs/P-13432 — 이 공고 분석해줘</div>
    <div style="margin-top:22px;font-size:12px;font-weight:700;color:var(--sub)">최근 작업</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px">
      <div class="card" style="margin:0"><div class="skel" style="margin:0"></div><div class="skel w60" style="margin-bottom:0"></div></div>
      <div class="card" style="margin:0"><div class="skel" style="margin:0"></div><div class="skel w60" style="margin-bottom:0"></div></div>
      <div class="card" style="margin:0"><div class="skel" style="margin:0"></div><div class="skel w60" style="margin-bottom:0"></div></div>
    </div>`
 : st==='empty'
 ? `<div class="h-row"><div class="h-title">무엇을 도와드릴까요?</div></div>
    <div class="cmd" style="display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px"><span style="flex:1">명령을 입력하거나 공고 링크를 붙여넣으세요</span><button class="btn" disabled>실행</button></div>
    <div class="empty" style="padding:60px 0">아직 작업이 없어요.<br>공고 링크를 붙여넣어 시작하세요.</div>`
 : `<div class="h-row"><div class="h-title">무엇을 도와드릴까요?</div></div>
    <div class="cmd filled" style="display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px"><span style="flex:1">https://careers.kakao.com/jobs/P-13432 — 이 공고 분석해줘</span><button class="btn" data-hot>실행</button><span class="cue">여기 클릭 →</span></div>
    <div style="margin-top:22px;font-size:12px;font-weight:700;color:var(--sub)">최근 작업</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px">
      <div class="card" style="margin:0"><div class="t">카카오 백엔드 분석</div><div class="d">어제</div></div>
      <div class="card" style="margin:0"><div class="t">자소서 초안 v2</div><div class="d">2일 전</div></div>
      <div class="card" style="margin:0"><div class="t">네이버 공고 수집</div><div class="d">3일 전</div></div>
    </div>`;
B.job=(st)=>st==='loading'
 ? `<div class="h-row"><div class="h-title">카카오 — 백엔드 엔지니어</div><span class="chip acc">분석 중</span></div><div class="skel"></div><div class="skel w80"></div><div class="skel w45"></div>`
 : `<div class="h-row"><div class="h-title">카카오 — 백엔드 엔지니어</div><span class="chip ok">분석 완료</span></div>
    <div class="card"><div class="t">요구 기술</div><span class="chip">Kotlin</span><span class="chip">Spring</span><span class="chip">MSA</span><span class="chip">Kafka</span></div>
    <div class="card"><div class="t">나와의 차이</div><div class="d">Kafka 경험 없음 · MSA는 부분 일치</div><span class="chip warn">Kafka — 보완 프로젝트로 커버 가능</span></div>
    <div class="card"><div class="t">근거 연결</div><div class="d">커리어 볼트 프로젝트 3개 연결됨</div></div>
    <div style="margin-top:14px;text-align:right"><button class="btn" data-hot>지원 준비 시작</button><span class="cue">여기 클릭 →</span></div>`;
const CHATHEAD=(t,chip)=>`<div class="h-row"><div class="h-title">${t}</div>${chip||''}</div>`;
const CHATIN=`<div class="chatinput">메시지 입력…</div>`;
const QCHIPS=(items,hot)=>items.map((c,i)=>`<button class="btn sec" ${i===hot?'data-hot':''} style="height:32px;font-size:13px;margin-right:6px">${c}</button>`).join('');
B.chat=(st)=>{
 const head=CHATHEAD('카카오 · 백엔드','<span class="chip acc">PREPARING</span>');
 if(st==='loading')return head+`<div class="msg ai">…</div><div class="skel w60"></div>`;
 if(st==='empty')return head+`<div style="padding:80px 0 20px;text-align:center">${QCHIPS(['공고 분석해줘','자소서 초안 만들어줘','면접 준비해줘'],-1)}</div>`+CHATIN;
 if(st==='suggest')return head+`
  <div class="msg ai">공고를 분석했어요. Kafka 경험이 부족해요. 자기소개서 초안부터 만들까요?</div>
  <div style="margin:4px 0 12px">${QCHIPS(['자소서 초안 만들어줘','프로젝트 추천해줘'],0)}<span class="cue">여기 클릭 →</span></div>`+CHATIN;
 if(st==='docdone')return head+`
  <div class="msg me">자소서 초안 만들어줘</div>
  <div class="msg ai">커리어 볼트 근거 3개로 초안을 만들었어요.</div>
  <div class="card"><div class="t">자기소개서 — 카카오 v1 <span class="chip ok">완성</span></div><div class="d">근거 3개 연결 · ATS 82</div>
  <div style="margin-top:10px"><button class="btn" data-hot style="height:34px">내 서류에서 열기</button><span class="cue">여기 클릭 →</span></div></div>`+CHATIN;
 if(st==='docedit')return head+`
  <div class="msg me">자소서 3번째 문장 수치 강조해줘</div>
  <div class="msg ai">반영했어요. "주문 처리량 3배 개선"을 전면에 배치했습니다.</div>
  <div class="card"><div class="d">수정 전: MSA 전환 프로젝트에서…<br>수정 후: 주문 처리량 3배 개선, MSA 전환에서…</div>
  <div style="margin-top:10px"><button class="btn sec" data-hot style="height:34px">이대로 확정 요청</button><span class="cue">여기 클릭 →</span></div></div>`+CHATIN;
 if(st==='approve-doc')return head+`
  <div class="approval"><div class="h">문서 확정 승인</div>
   <div class="d" style="font-size:13px;color:var(--sub);margin-bottom:10px">자기소개서 — 카카오 v1을 PDF로 출력하고 지원 패키지에 포함합니다. 근거 3개 연결 확인됨.</div>
   <button class="btn" data-hot>승인하고 PDF 출력</button><span class="cue">여기 클릭 →</span></div>`+CHATIN;
 if(st==='blueprints')return head+`
  <div class="msg me">부족한 역량 보완할 프로젝트 추천해줘</div>

function fmtAgo(iso){if(!iso)return'';const d=(Date.now()-new Date(iso).getTime())/1000;if(d<60)return'방금';if(d<3600)return Math.floor(d/60)+'분 전';return new Date(iso).toLocaleDateString('ko-KR');}

/* 탭 */
function buildTabs(){
  $('#scen-tabs').innerHTML=TABS.map(t=>`<button class="stab" data-tab="${t.id}">${t.name}</button>`).join('');
  document.querySelectorAll('.stab').forEach(b=>b.addEventListener('click',()=>{
    const i=SCEN.findIndex(s=>s.tab==b.dataset.tab);if(i>=0){cur=i;curState=null;hmm=false;render();}
  }));
}

/* 렌더 */
function render(){
  const s=SCEN[cur];
  document.querySelectorAll('.stab').forEach(b=>b.classList.toggle('on',+b.dataset.tab===s.tab));
  $('#scene-title').textContent=`장면 ${s.n} · 화면 ${s.screen} ${s.screenName}`;
  $('#scene-story').textContent=s.story;
  $('#p-now').textContent=s.story;
  $('#p-areas').innerHTML=s.areas.map((a,i)=>`<li><b>${CIRCLE[i]}</b>${a}</li>`).join('');
  $('#p-chips').innerHTML=s.chips.map(c=>`<span class="c">${c}</span>`).join('');
  $('#p-gaze').textContent=s.gaze;
  const keys=Object.keys(s.states);
  if(!keys.includes(curState))curState=s.def;
  $('#p-seg').innerHTML=Object.entries(s.states).map(([k,l])=>`<button data-st="${k}" class="${k===curState?'on':''}">${l}</button>`).join('')
    +['눌렀을 때','성공','실패','비활성'].filter(l=>!Object.values(s.states).includes(l)).map(l=>`<button disabled title="이 장면에는 없어요">${l}</button>`).join('');
  document.querySelectorAll('#p-seg button[data-st]').forEach(b=>b.addEventListener('click',()=>{curState=b.dataset.st;render();}));
  /* 프레임 */
  const body=s.body(curState);
  $('#win').innerHTML=WIN(s.side||'',s.screenName,body)
    +'<div class="gaze" id="gaze" hidden></div>';
  /* 영역 배지: 간단히 좌상단 순서대로 */
  const cv=$('#win .canvas');
  s.areas.slice(0,5).forEach((a,i)=>{
    const b=document.createElement('span');b.className='badge';b.textContent=CIRCLE[i];
    b.style.top=(14+i*0)+'px';b.style.left=(14+i*30)+'px'; /* 대략 위치 — 주요 요소에 근접 배치는 수동 좌표 대신 좌상단 열 */
    cv.appendChild(b);
  });
  /* 핫 버튼 */
  const hot=$('#win [data-hot]');
  if(hot){hot.classList.add('hot');hot.addEventListener('click',e=>{e.stopPropagation();if(cur<SCEN.length-1){cur++;curState=null;hmm=false;render();}else toast('투어 끝! 전체 의견을 남겨 주세요');});}
  $('#win').querySelectorAll('button:not([data-hot]), .card:not([data-hot])').forEach(el=>{
    el.addEventListener('click',e=>{if(e.target.closest('[data-hot]'))return;toast('이 투어에서는 안 쓰는 버튼이에요');});
  });
  /* 시선 화살표 */
  drawGaze(s);
  /* 페이지네이션 */
  $('#pos').textContent=`${cur+1} / ${SCEN.length}`;
  $('#dots').innerHTML=SCEN.map((x,i)=>`<i class="${i===cur?'on':''}${FB[x.n]&&FB[x.n].reaction!=='good'?' marked':''}"></i>`).join('');
  $('#prev').disabled=cur===0;$('#next').disabled=cur===SCEN.length-1;
  /* 의견 복원 */
  const f=FB[s.n];
  hmm=!!(f&&f.reaction==='confusing');
  $('#fb-hmm').classList.toggle('on',hmm);
  $('#fb-detail').hidden=!hmm;
  if(hmm){
    $('#fb-marks').innerHTML=s.areas.slice(0,5).map((a,i)=>`<button data-m="${CIRCLE[i]}" class="${f&&f.marks&&f.marks.includes(CIRCLE[i])?'on':''}">${CIRCLE[i]}</button>`).join('');
    $('#fb-marks').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>b.classList.toggle('on')));
    $('#fb-text').value=f&&f.text?f.text:'';
    $('#save').disabled=false;
  }else{$('#save').disabled=true;}
  $('#saved').textContent=f?`저장됨 ✓ ${fmtAgo(f.updatedAt)}`:'';
  $('#h-count').textContent=`의견 ${Object.keys(FB).length}/${SCEN.length}`;
}
function drawGaze(s){
  const g=$('#gaze');if(!g)return;
  g.innerHTML=s.areas.slice(0,5).map((a,i)=>`<i style="top:${40+i*60}px;left:${30+i*40}px">${CIRCLE[i]}</i>`).join('');
  g.hidden=!gazeOn;
}
$('#gaze-toggle').addEventListener('click',()=>{gazeOn=!gazeOn;$('#gaze-toggle').textContent=gazeOn?'흐름 화살표 숨기기':'흐름 화살표 보기';drawGaze(SCEN[cur]);});
$('#prev').addEventListener('click',()=>{if(cur>0){cur--;curState=null;hmm=false;render();}});
$('#next').addEventListener('click',()=>{if(cur<SCEN.length-1){cur++;curState=null;hmm=false;render();}});
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')$('#prev').click();if(e.key==='ArrowRight')$('#next').click();});

/* 저장 */
async function persist(path,doc){
  if(dbReady&&db){await db.doc(path).set(doc);}
  else{let all={};try{all=JSON.parse(localStorage.getItem(LS_KEY)||'{}');}catch(_){/* */}all[path]=doc;try{localStorage.setItem(LS_KEY,JSON.stringify(all));}catch(_){throw{code:'unavailable'};}}
}
$('#fb-good').addEventListener('click',async()=>{
  const s=SCEN[cur],doc={scene:s.n,screen:s.screen,reaction:'good',marks:[],markNames:[],text:'',updatedAt:new Date().toISOString()};
  try{await persist(`feedback/scene-${s.n}`,doc);FB[s.n]=doc;render();toast('저장됨 ✓');}catch(e){toast('저장 실패, 다시 눌러 주세요');}
});
$('#fb-hmm').addEventListener('click',()=>{hmm=!hmm;$('#fb-detail').hidden=!hmm;$('#fb-hmm').classList.toggle('on',hmm);$('#save').disabled=!hmm;if(hmm){const s=SCEN[cur];$('#fb-marks').innerHTML=s.areas.slice(0,5).map((a,i)=>`<button data-m="${CIRCLE[i]}">${CIRCLE[i]}</button>`).join('');$('#fb-marks').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>b.classList.toggle('on')));}});
$('#save').addEventListener('click',async()=>{
  const s=SCEN[cur];
  const marks=[...$('#fb-marks').querySelectorAll('button.on')].map(b=>b.dataset.m);
  const markNames=marks.map(m=>s.areas[CIRCLE.indexOf(m)]||m);
  const doc={scene:s.n,screen:s.screen,reaction:'confusing',marks,markNames,text:$('#fb-text').value.trim(),updatedAt:new Date().toISOString()};
  try{await persist(`feedback/scene-${s.n}`,doc);FB[s.n]=doc;render();toast('저장됨 ✓');}catch(e){toast('저장 실패, 다시 눌러 주세요');}
});
$('#ov-save').addEventListener('click',async()=>{
  const doc={unit:'overall',n:0,label:'전체',text:$('#ov-text').value.trim(),updatedAt:new Date().toISOString()};
  try{await persist('feedback/overall',doc);$('#ov-saved').textContent='저장됨 ✓';toast('저장됨 ✓');}catch(e){toast('저장 실패');}
});

/* 복원 */
async function initFeedback(){
  try{db=window.claude&&typeof window.claude.use==='function'?await window.claude.use('db'):null;}catch(e){db=null;}
  if(db){dbReady=true;try{const snap=await db.collection('feedback').get();snap.docs.forEach(d=>{const data=d.data();if(/^scene-\d+$/.test(d.id))FB[data.scene]=data;});}catch(e){/* */}}
  else{let all={};try{all=JSON.parse(localStorage.getItem(LS_KEY)||'{}');}catch(_){/* */}Object.entries(all).forEach(([p,d])=>{const m=/^feedback\/scene-(\d+)$/.exec(p);if(m)FB[+m[1]]=d;if(p==='feedback/overall')$('#ov-text').value=d.text||'';});}
  render();
}
buildTabs();
render();
initFeedback();
</script>
