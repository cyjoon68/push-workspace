.sb .it{font-size:13px;padding:6px 10px;border-radius:8px;color:var(--ink);display:flex;align-items:center;gap:8px}
.sb .it.on{background:#EEF3FF;color:var(--acc);font-weight:600}
.sb .it .dot{width:6px;height:6px;border-radius:50%;background:#C7CBD1}
.canvas{padding:18px 22px;overflow:hidden;position:relative}
.badge{position:absolute;width:22px;height:22px;border-radius:50%;background:rgba(47,107,255,.92);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;z-index:6}

/* 화면 요소 */
.h-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.h-title{font-size:18px;font-weight:700}
.cmd{border:2px solid var(--line);border-radius:14px;padding:16px;font-size:15px;color:var(--sub);background:#fff}
.cmd.filled{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;font:inherit;font-weight:700;font-size:14px;height:40px;padding:0 18px;border-radius:10px;border:0;background:var(--acc);color:#fff;cursor:pointer}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--acc)}
.btn:disabled{opacity:.5}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.card .t{font-weight:700;margin-bottom:4px}
.card .d{font-size:13px;color:var(--sub)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--sub);margin:2px 4px 2px 0}
.chip.acc{background:#EEF3FF;color:var(--acc)}
.chip.warn{background:#FEF3C7;color:#92400E}
.chip.ok{background:#D1FAE5;color:#065F46}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--soft);font-size:14px}
.row:last-child{border-bottom:0}
.msg{max-width:80%;padding:10px 14px;border-radius:14px;margin-bottom:10px;font-size:14px}
.msg.ai{background:var(--soft)}
.msg.me{background:var(--acc);color:#fff;margin-left:auto}
.chatinput{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--sub);display:flex;justify-content:space-between;align-items:center}
.docline{height:11px;border-radius:6px;background:#E9EBEF;margin:10px 0}
.docline.w60{width:60%}.docline.w80{width:80%}.docline.w45{width:45%}
.sel{background:#DBEAFE;border-radius:4px;padding:1px 3px;font-size:14px}
.bubble{display:inline-flex;gap:6px;background:var(--ink);color:#fff;border-radius:10px;padding:6px 8px;font-size:12px}
.bubble span{padding:2px 8px;border-radius:6px;cursor:pointer}
.bubble span:hover{background:#374151}
.approval{border:2px solid var(--acc);border-radius:12px;padding:14px 16px;background:#F8FAFF}
.approval .h{font-weight:700;color:var(--acc);margin-bottom:6px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:#F3F4F6;border-radius:8px;padding:8px 10px;color:#374151;white-space:pre-wrap}
.empty{color:var(--sub);text-align:center;padding:48px 0;font-size:14px}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,#EEF0F3,#E2E5EA,#EEF0F3);margin:12px 0;animation:sk 1.2s infinite}
@keyframes sk{0%{opacity:.6}50%{opacity:1}100%{opacity:.6}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,107,255,.45)}70%{box-shadow:0 0 0 10px rgba(47,107,255,0)}100%{box-shadow:0 0 0 0 rgba(47,107,255,0)}}
.hot{outline:3px solid var(--acc)!important;outline-offset:2px;animation:pulse 1.6s infinite;cursor:pointer;position:relative;z-index:5}
.cue{position:absolute;left:-148px;transform:translateY(-50%);background:var(--acc);color:#fff;font-size:12px;font-weight:700;padding:6px 12px;border-radius:10px;white-space:nowrap;z-index:7}
.cue::after{content:&quot;&quot;;position:absolute;right:-6px;top:50%;transform:translateY(-50%);border:6px solid transparent;border-left-color:var(--acc)}

/* 오른쪽 패널 */
.panel{display:flex;flex-direction:column;gap:14px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.pcard .eyebrow{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--sub);text-transform:uppercase;margin-bottom:8px}
.pcard p{margin:0;font-size:14px}
.areas{list-style:none;margin:0;padding:0;font-size:14px}
.areas li{padding:3px 0}
.areas b{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;align-items:center;justify-content:center;margin-right:8px}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
.chiprow .c{background:var(--soft);border-radius:8px;padding:4px 10px}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.seg button{font:inherit;font-size:12px;font-weight:600;padding:5px 10px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--sub)}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg button:disabled{opacity:.35;cursor:default}
.fbbtns{display:flex;gap:8px}
.fbb{flex:1;font:inherit;font-weight:700;font-size:14px;height:40px;border-radius:10px;cursor:pointer;border:1px solid var(--line);background:#fff}
.fbb.good{background:var(--acc);border-color:var(--acc);color:#fff}
.fbb.hmm.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.marks{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.marks button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer}
.marks button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
textarea{width:100%;font:inherit;font-size:14px;line-height:1.5;padding:10px 12px;border:1px solid var(--line);border-radius:10px;resize:vertical;min-height:64px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);padding:8px 16px;border-radius:18px;background:var(--ink);color:#fff;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.gaze{position:absolute;inset:0;pointer-events:none;z-index:4}
.gaze i{position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;border:2px dashed var(--acc);color:var(--acc);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.overall{margin-top:40px;display:grid;grid-template-columns:132px minmax(0,1fr);gap:24px;align-items:start}
.overall .fb{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
@media (max-width:1100px){.stage{grid-template-columns:1fr}.strip{position:static;flex-direction:row;flex-wrap:wrap;align-items:center}}
@media (prefers-reduced-motion:reduce){.hot{animation:none}.toast{transition:none}}
&lt;/style&gt;

    &lt;div class=&quot;pcard&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;시선 흐름&lt;/div&gt;&lt;p id=&quot;p-gaze&quot;&gt;&lt;/p&gt;&lt;button class=&quot;btn sec&quot; id=&quot;gaze-toggle&quot; style=&quot;height:32px;font-size:12px;margin-top:8px&quot;&gt;흐름 화살표 보기&lt;/button&gt;&lt;/div&gt;

&lt;script&gt;
/* ============ 공통 프레임 ============ */
const SIDEBAR=(on)=&gt;`
&lt;div class=&quot;sb&quot;&gt;
  &lt;div class=&quot;sec&quot;&gt;기능&lt;/div&gt;
  ${[&quot;내 서류&quot;,&quot;지원 관리&quot;,&quot;커리어 볼트&quot;,&quot;면접&quot;,&quot;캘린더&quot;,&quot;오퍼&quot;,&quot;반복 작업&quot;].map(n=&gt;`&lt;div class=&quot;it${on===n?&#x27; on&#x27;:&#x27;&#x27;}&quot;&gt;&lt;i class=&quot;dot&quot;&gt;&lt;/i&gt;${n}&lt;/div&gt;`).join(&quot;&quot;)}
  &lt;div class=&quot;sec&quot;&gt;채팅&lt;/div&gt;
  ${[&quot;카카오 · 백엔드&quot;,&quot;네이버 · 플랫폼&quot;].map(n=&gt;`&lt;div class=&quot;it${on===n?&#x27; on&#x27;:&#x27;&#x27;}&quot;&gt;&lt;i class=&quot;dot&quot;&gt;&lt;/i&gt;${n}&lt;/div&gt;`).join(&quot;&quot;)}
  &lt;div class=&quot;it${on===&#x27;Kafka 파이프라인&#x27;?&#x27; on&#x27;:&#x27;&#x27;}&quot;&gt;&lt;i class=&quot;dot&quot; style=&quot;border-radius:2px&quot;&gt;&lt;/i&gt;Kafka 파이프라인&lt;span style=&quot;margin-left:auto;font-size:10px;color:var(--sub)&quot;&gt;프로젝트&lt;/span&gt;&lt;/div&gt;
  &lt;div style=&quot;flex:1&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;it${on===&#x27;설정&#x27;?&#x27; on&#x27;:&#x27;&#x27;}&quot;&gt;&lt;i class=&quot;dot&quot;&gt;&lt;/i&gt;설정&lt;/div&gt;
&lt;/div&gt;`;
const WIN=(side,title,body)=&gt;`
&lt;div class=&quot;titlebar&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;span&gt;Push — ${title}&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;winbody&quot;&gt;${SIDEBAR(side)}&lt;div class=&quot;canvas&quot;&gt;${body}&lt;/div&gt;&lt;/div&gt;`;

/* ============ 화면 본문 ============ */
const B={};
B.home=(st)=&gt;st===&#x27;loading&#x27;
 ? `&lt;div class=&quot;h-row&quot;&gt;&lt;div class=&quot;h-title&quot;&gt;무엇을 도와드릴까요?&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;cmd filled&quot; style=&quot;display:flex;align-items:center;gap:10px&quot;&gt;https://careers.kakao.com/jobs/P-13432 — 이 공고 분석해줘&lt;/div&gt;
    &lt;div style=&quot;margin-top:22px;font-size:12px;font-weight:700;color:var(--sub)&quot;&gt;최근 작업&lt;/div&gt;
    &lt;div style=&quot;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px&quot;&gt;
      &lt;div class=&quot;card&quot; style=&quot;margin:0&quot;&gt;&lt;div class=&quot;skel&quot; style=&quot;margin:0&quot;&gt;&lt;/div&gt;&lt;div class=&quot;skel w60&quot; style=&quot;margin-bottom:0&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;margin:0&quot;&gt;&lt;div class=&quot;skel&quot; style=&quot;margin:0&quot;&gt;&lt;/div&gt;&lt;div class=&quot;skel w60&quot; style=&quot;margin-bottom:0&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;margin:0&quot;&gt;&lt;div class=&quot;skel&quot; style=&quot;margin:0&quot;&gt;&lt;/div&gt;&lt;div class=&quot;skel w60&quot; style=&quot;margin-bottom:0&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;`
 : st===&#x27;empty&#x27;
 ? `&lt;div class=&quot;h-row&quot;&gt;&lt;div class=&quot;h-title&quot;&gt;무엇을 도와드릴까요?&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;cmd&quot; style=&quot;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px&quot;&gt;&lt;span style=&quot;flex:1&quot;&gt;명령을 입력하거나 공고 링크를 붙여넣으세요&lt;/span&gt;&lt;button class=&quot;btn&quot; disabled&gt;실행&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;empty&quot; style=&quot;padding:60px 0&quot;&gt;아직 작업이 없어요.&lt;br&gt;공고 링크를 붙여넣어 시작하세요.&lt;/div&gt;`
 : `&lt;div class=&quot;h-row&quot;&gt;&lt;div class=&quot;h-title&quot;&gt;무엇을 도와드릴까요?&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;cmd filled&quot; style=&quot;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px&quot;&gt;&lt;span style=&quot;flex:1&quot;&gt;https://careers.kakao.com/jobs/P-13432 — 이 공고 분석해줘&lt;/span&gt;&lt;button class=&quot;btn&quot; data-hot&gt;실행&lt;/button&gt;&lt;span class=&quot;cue&quot;&gt;여기 클릭 →&lt;/span&gt;&lt;/div&gt;
    &lt;div style=&quot;margin-top:22px;font-size:12px;font-weight:700;color:var(--sub)&quot;&gt;최근 작업&lt;/div&gt;
    &lt;div style=&quot;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px&quot;&gt;
      &lt;div class=&quot;card&quot; style=&quot;margin:0&quot;&gt;&lt;div class=&quot;t&quot;&gt;카카오 백엔드 분석&lt;/div&gt;&lt;div class=&quot;d&quot;&gt;어제&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;margin:0&quot;&gt;&lt;div class=&quot;t&quot;&gt;자소서 초안 v2&lt;/div&gt;&lt;div class=&quot;d&quot;&gt;2일 전&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;margin:0&quot;&gt;&lt;div class=&quot;t&quot;&gt;네이버 공고 수집&lt;/div&gt;&lt;div class=&quot;d&quot;&gt;3일 전&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;`;
B.job=(st)=&gt;st===&#x27;loading&#x27;
 ? `&lt;div class=&quot;h-row&quot;&gt;&lt;div class=&quot;h-title&quot;&gt;카카오 — 백엔드 엔지니어&lt;/div&gt;&lt;span class=&quot;chip acc&quot;&gt;분석 중&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;skel&quot;&gt;&lt;/div&gt;&lt;div class=&quot;skel w80&quot;&gt;&lt;/div&gt;&lt;div class=&quot;skel w45&quot;&gt;&lt;/div&gt;`
 : `&lt;div class=&quot;h-row&quot;&gt;&lt;div class=&quot;h-title&quot;&gt;카카오 — 백엔드 엔지니어&lt;/div&gt;&lt;span class=&quot;chip ok&quot;&gt;분석 완료&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;t&quot;&gt;요구 기술&lt;/div&gt;&lt;span class=&quot;chip&quot;&gt;Kotlin&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Spring&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;MSA&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Kafka&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;t&quot;&gt;나와의 차이&lt;/div&gt;&lt;div class=&quot;d&quot;&gt;Kafka 경험 없음 · MSA는 부분 일치&lt;/div&gt;&lt;span class=&quot;chip warn&quot;&gt;Kafka — 보완 프로젝트로 커버 가능&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;t&quot;&gt;근거 연결&lt;/div&gt;&lt;div class=&quot;d&quot;&gt;커리어 볼트 프로젝트 3개 연결됨&lt;/div&gt;&lt;/div&gt;
    &lt;div style=&quot;margin-top:14px;text-align:right&quot;&gt;&lt;button class=&quot;btn&quot; data-hot&gt;지원 준비 시작&lt;/button&gt;&lt;span class=&quot;cue&quot;&gt;여기 클릭 →&lt;/span&gt;&lt;/div&gt;`;
const CHATHEAD=(t,chip)=&gt;`&lt;div class=&quot;h-row&quot;&gt;&lt;div class=&quot;h-title&quot;&gt;${t}&lt;/div&gt;${chip||&#x27;&#x27;}&lt;/div&gt;`;
const CHATIN=`&lt;div class=&quot;chatinput&quot;&gt;메시지 입력…&lt;/div&gt;`;
const QCHIPS=(items,hot)=&gt;items.map((c,i)=&gt;`&lt;button class=&quot;btn sec&quot; ${i===hot?&#x27;data-hot&#x27;:&#x27;&#x27;} style=&quot;height:32px;font-size:13px;margin-right:6px&quot;&gt;${c}&lt;/button&gt;`).join(&#x27;&#x27;);
B.chat=(st)=&gt;{
 const head=CHATHEAD(&#x27;카카오 · 백엔드&#x27;,&#x27;&lt;span class=&quot;chip acc&quot;&gt;PREPARING&lt;/span&gt;&#x27;);
 if(st===&#x27;loading&#x27;)return head+`&lt;div class=&quot;msg ai&quot;&gt;…&lt;/div&gt;&lt;div class=&quot;skel w60&quot;&gt;&lt;/div&gt;`;

const TABS=[{id:1,name:&quot;시나리오 1 — 공고 등록부터 서류 확정까지&quot;},{id:2,name:&quot;시나리오 2 — 프로젝트 실행 승인부터 근거 반영까지&quot;}];

/* ============ 상태 ============ */
let cur=0,curState=null,gazeOn=false,hmm=false;
const FB={};
let db=null,dbReady=false;
const LS_KEY=&#x27;flow-feedback&#x27;;
const $=(s,r=document)=&gt;r.querySelector(s);

let toastT;
function toast(m){const t=$(&#x27;#toast&#x27;);t.textContent=m;t.classList.add(&#x27;show&#x27;);clearTimeout(toastT);toastT=setTimeout(()=&gt;t.classList.remove(&#x27;show&#x27;),2200);}
function fmtAgo(iso){if(!iso)return&#x27;&#x27;;const d=(Date.now()-new Date(iso).getTime())/1000;if(d&lt;60)return&#x27;방금&#x27;;if(d&lt;3600)return Math.floor(d/60)+&#x27;분 전&#x27;;return new Date(iso).toLocaleDateString(&#x27;ko-KR&#x27;);}

/* 탭 */
function buildTabs(){
  $(&#x27;#scen-tabs&#x27;).innerHTML=TABS.map(t=&gt;`&lt;button class=&quot;stab&quot; data-tab=&quot;${t.id}&quot;&gt;${t.name}&lt;/button&gt;`).join(&#x27;&#x27;);
  document.querySelectorAll(&#x27;.stab&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;{
    const i=SCEN.findIndex(s=&gt;s.tab==b.dataset.tab);if(i&gt;=0){cur=i;curState=null;hmm=false;render();}
  }));
}

/* 렌더 */
function render(){
  const s=SCEN[cur];
  document.querySelectorAll(&#x27;.stab&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;on&#x27;,+b.dataset.tab===s.tab));
  $(&#x27;#scene-title&#x27;).textContent=`장면 ${s.n} · 화면 ${s.screen} ${s.screenName}`;
  $(&#x27;#scene-story&#x27;).textContent=s.story;
  $(&#x27;#p-now&#x27;).textContent=s.story;
  $(&#x27;#p-areas&#x27;).innerHTML=s.areas.map((a,i)=&gt;`&lt;li&gt;&lt;b&gt;${CIRCLE[i]}&lt;/b&gt;${a}&lt;/li&gt;`).join(&#x27;&#x27;);
  $(&#x27;#p-chips&#x27;).innerHTML=s.chips.map(c=&gt;`&lt;span class=&quot;c&quot;&gt;${c}&lt;/span&gt;`).join(&#x27;&#x27;);
  $(&#x27;#p-gaze&#x27;).textContent=s.gaze;
  const keys=Object.keys(s.states);
  if(!keys.includes(curState))curState=s.def;
  $(&#x27;#p-seg&#x27;).innerHTML=Object.entries(s.states).map(([k,l])=&gt;`&lt;button data-st=&quot;${k}&quot; class=&quot;${k===curState?&#x27;on&#x27;:&#x27;&#x27;}&quot;&gt;${l}&lt;/button&gt;`).join(&#x27;&#x27;)
    +[&#x27;눌렀을 때&#x27;,&#x27;성공&#x27;,&#x27;실패&#x27;,&#x27;비활성&#x27;].filter(l=&gt;!Object.values(s.states).includes(l)).map(l=&gt;`&lt;button disabled title=&quot;이 장면에는 없어요&quot;&gt;${l}&lt;/button&gt;`).join(&#x27;&#x27;);
  document.querySelectorAll(&#x27;#p-seg button[data-st]&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;{curState=b.dataset.st;render();}));
  /* 프레임 */
  const body=s.body(curState);
  $(&#x27;#win&#x27;).innerHTML=WIN(s.side||&#x27;&#x27;,s.screenName,body)
    +&#x27;&lt;div class=&quot;gaze&quot; id=&quot;gaze&quot; hidden&gt;&lt;/div&gt;&#x27;;
  /* 영역 배지: 간단히 좌상단 순서대로 */
  const cv=$(&#x27;#win .canvas&#x27;);
  s.areas.slice(0,5).forEach((a,i)=&gt;{
    const b=document.createElement(&#x27;span&#x27;);b.className=&#x27;badge&#x27;;b.textContent=CIRCLE[i];
    b.style.top=(14+i*0)+&#x27;px&#x27;;b.style.left=(14+i*30)+&#x27;px&#x27;; /* 대략 위치 — 주요 요소에 근접 배치는 수동 좌표 대신 좌상단 열 */

  });
  /* 시선 화살표 */
  drawGaze(s);
  /* 페이지네이션 */
  $(&#x27;#pos&#x27;).textContent=`${cur+1} / ${SCEN.length}`;
  $(&#x27;#dots&#x27;).innerHTML=SCEN.map((x,i)=&gt;`&lt;i class=&quot;${i===cur?&#x27;on&#x27;:&#x27;&#x27;}${FB[x.n]&amp;&amp;FB[x.n].reaction!==&#x27;good&#x27;?&#x27; marked&#x27;:&#x27;&#x27;}&quot;&gt;&lt;/i&gt;`).join(&#x27;&#x27;);
  $(&#x27;#prev&#x27;).disabled=cur===0;$(&#x27;#next&#x27;).disabled=cur===SCEN.length-1;
  /* 의견 복원 */

function drawGaze(s){

$(&#x27;#prev&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{if(cur&gt;0){cur--;curState=null;hmm=false;render();}});
$(&#x27;#next&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{if(cur&lt;SCEN.length-1){cur++;curState=null;hmm=false;render();}});

/* 저장 */
async function persist(path,doc){
  if(dbReady&amp;&amp;db){await db.doc(path).set(doc);}
  else{let all={};try{all=JSON.parse(localStorage.getItem(LS_KEY)||&#x27;{}&#x27;);}catch(_){/* */}all[path]=doc;try{localStorage.setItem(LS_KEY,JSON.stringify(all));}catch(_){throw{code:&#x27;unavailable&#x27;};}}
}
$(&#x27;#fb-good&#x27;).addEventListener(&#x27;click&#x27;,async()=&gt;{
  const s=SCEN[cur],doc={scene:s.n,screen:s.screen,reaction:&#x27;good&#x27;,marks:[],markNames:[],text:&#x27;&#x27;,updatedAt:new Date().toISOString()};
  try{await persist(`feedback/scene-${s.n}`,doc);FB[s.n]=doc;render();toast(&#x27;저장됨 ✓&#x27;);}catch(e){toast(&#x27;저장 실패, 다시 눌러 주세요&#x27;);}
});
$(&#x27;#fb-hmm&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{hmm=!hmm;$(&#x27;#fb-detail&#x27;).hidden=!hmm;$(&#x27;#fb-hmm&#x27;).classList.toggle(&#x27;on&#x27;,hmm);$(&#x27;#save&#x27;).disabled=!hmm;if(hmm){const s=SCEN[cur];$(&#x27;#fb-marks&#x27;).innerHTML=s.areas.slice(0,5).map((a,i)=&gt;`&lt;button data-m=&quot;${CIRCLE[i]}&quot;&gt;${CIRCLE[i]}&lt;/button&gt;`).join(&#x27;&#x27;);$(&#x27;#fb-marks&#x27;).querySelectorAll(&#x27;button&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;b.classList.toggle(&#x27;on&#x27;)));}});
$(&#x27;#save&#x27;).addEventListener(&#x27;click&#x27;,async()=&gt;{
  const s=SCEN[cur];
  const marks=[...$(&#x27;#fb-marks&#x27;).querySelectorAll(&#x27;button.on&#x27;)].map(b=&gt;b.dataset.m);
  const markNames=marks.map(m=&gt;s.areas[CIRCLE.indexOf(m)]||m);
  const doc={scene:s.n,screen:s.screen,reaction:&#x27;confusing&#x27;,marks,markNames,text:$(&#x27;#fb-text&#x27;).value.trim(),updatedAt:new Date().toISOString()};
  try{await persist(`feedback/scene-${s.n}`,doc);FB[s.n]=doc;render();toast(&#x27;저장됨 ✓&#x27;);}catch(e){toast(&#x27;저장 실패, 다시 눌러 주세요&#x27;);}
});
$(&#x27;#ov-save&#x27;).addEventListener(&#x27;click&#x27;,async()=&gt;{
  const doc={unit:&#x27;overall&#x27;,n:0,label:&#x27;전체&#x27;,text:$(&#x27;#ov-text&#x27;).value.trim(),updatedAt:new Date().toISOString()};
  try{await persist(&#x27;feedback/overall&#x27;,doc);$(&#x27;#ov-saved&#x27;).textContent=&#x27;저장됨 ✓&#x27;;toast(&#x27;저장됨 ✓&#x27;);}catch(e){toast(&#x27;저장 실패&#x27;);}

/* 복원 */
async function initFeedback(){
  try{db=window.claude&amp;&amp;typeof window.claude.use===&#x27;function&#x27;?await window.claude.use(&#x27;db&#x27;):null;}catch(e){db=null;}
  if(db){dbReady=true;try{const snap=await db.collection(&#x27;feedback&#x27;).get();snap.docs.forEach(d=&gt;{const data=d.data();if(/^scene-\d+$/.test(d.id))FB[data.scene]=data;});}catch(e){/* */}}

  render();
}
buildTabs();
render();
initFeedback();

<script>
const META=[{"key": "structure", "title": "1단계 구조", "prefixes": ["structure-"], "stage": "1단계 구조"}, {"key": "flow-tour", "title": "2단계 따라가 보기", "prefixes": ["scene-"], "stage": "2단계 플로우"}, {"key": "reference", "title": "3단계 레퍼런스", "prefixes": ["ref-"], "stage": "3단계 레퍼런스"}, {"key": "taste-color", "title": "색상", "prefixes": ["axis-"], "stage": "3단계 취향"}, {"key": "taste-shape", "title": "모양·간격", "prefixes": ["axis-"], "stage": "3단계 취향"}, {"key": "taste-type", "title": "글자", "prefixes": ["axis-"], "stage": "3단계 취향"}, {"key": "rules-preview", "title": "4단계 규칙", "prefixes": ["rules-"], "stage": "4단계 규칙"}, {"key": "final-preview", "title": "최종 미리보기", "prefixes": ["screen-"], "stage": "5단계 직전"}];
const tabs=[...document.querySelectorAll('.tab')],panes=[...document.querySelectorAll('.pane')];
let seen={};try{seen=JSON.parse(localStorage.getItem('hub-seen')||'{}')}catch(e){}
function show(key){
  tabs.forEach(t=>t.classList.toggle('on',t.dataset.key===key));
  panes.forEach(p=>p.hidden=p.dataset.key!==key);
  seen[key]=1;try{localStorage.setItem('hub-seen',JSON.stringify(seen))}catch(e){}
  try{location.hash=key}catch(e){}
  paint();
}
tabs.forEach(t=>t.addEventListener('click',()=>show(t.dataset.key)));
let counts={};
function paint(){
  let unseen=[],empty=[];
  META.forEach(m=>{
    const t=tabs.find(x=>x.dataset.key===m.key);
    t.classList.toggle('unseen',!seen[m.key]);
    const n=m.prefixes.reduce((a,p)=>a+(counts[p]||0),0);const b=document.getElementById('badge-'+m.key);
    b.textContent=n?`저장 ${n}건`:'아직 없음';b.classList.toggle('ok',n>0);
    if(!seen[m.key])unseen.push(m.title);else if(!n)empty.push(m.title);
  });
  const el=document.getElementById('todo');
  if(!unseen.length&&!empty.length)el.innerHTML='모든 탭을 보고 저장했어요 ✓';
  else el.innerHTML=(unseen.length?`아직 안 본 탭: <b>${unseen.join(', ')}</b>`:'')+(unseen.length&&empty.length?' · ':'')+(empty.length?`저장 없는 탭: <b>${empty.join(', ')}</b>`:'');
}
let realDb=null;
const dbReady=(async()=>{try{realDb=window.claude&&typeof window.claude.use==='function'?await window.claude.use('db'):null;}catch(e){realDb=null;}})();
window.addEventListener('message',async e=>{
  const m=e.data;if(!m||m.__hubdb!==1||!e.source)return;
  if(!panes.some(p=>p.contentWindow===e.source))return;
  const reply=(result,error)=>{try{e.source.postMessage({__hubdb:1,id:m.id,result,error},'*');}catch(x){}};
  try{
    await dbReady;
    if(m.op==='avail')return reply(!!realDb);
    if(!realDb)throw {code:'not_granted',message:'db unavailable'};
    if(m.op==='get'){const s=await realDb.doc(m.path).get();return reply({id:s.id,exists:s.exists,data:s.data()});}
    if(m.op==='set'){await realDb.doc(m.path).set(m.data);loadCounts();return reply(true);}
    if(m.op==='update'){await realDb.doc(m.path).update(m.data);loadCounts();return reply(true);}
    if(m.op==='delete'){await realDb.doc(m.path).delete();loadCounts();return reply(true);}
    if(m.op==='list'){const q=await realDb.collection(m.path).get();return reply(q.docs.map(d=>({id:d.id,exists:d.exists,data:d.data()})));}
    throw {code:'invalid_argument',message:'unknown op'};
  }catch(err){reply(null,{code:(err&&err.code)||'unavailable',message:(err&&err.message)||String(err)});}
});
async function loadCounts(){
  try{
    await dbReady;const db=realDb;
    if(!db)return;
    const snap=await db.collection('feedback').get();
    counts={};
    snap.docs.forEach(d=>{const id=d.id;const dd=d.data()||{};const has=(dd.reaction||dd.best||dd.worst||(dd.marks&&dd.marks.length)||(dd.want&&dd.want.length)||(dd.dislike&&dd.dislike.length)||dd.answers||dd.choices||(dd.text&&dd.text.trim()));if(!has)return;META.forEach(x=>x.prefixes.forEach(p=>{if(id.startsWith(p)&&(id===p||!/\d/.test(p.slice(-1))||id.length===p.length))counts[p]=(counts[p]||0)+1;}));});
    paint();
  }catch(e){}
}
const first=(location.hash||'').slice(1);
show(META.some(m=>m.key===first)?first:META[0].key);
loadCounts();setInterval(loadCounts,20000);
</script>
