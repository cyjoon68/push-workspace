<meta charset="utf-8"><title>3단계 레퍼런스</title>
<style>
:root{color-scheme:light only;
  --bg:#F7F8FA;--card:#FFFFFF;--line:#E5E7EB;--ink:#1F2937;--sub:#6B7280;--soft:#EEF0F3;
  --acc:#2F6BFF;--acc-d:#1F4ED8;--ok:#166534;--frame-w:1440px}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:14px/1.5 "Pretendard",-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:28px 24px 80px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--sub);font-size:13px;margin-bottom:28px}
.ref{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:26px}
.ref h2{font-size:16px;margin:0 0 2px}
.ref .why{color:var(--sub);font-size:13px;margin-bottom:14px}
.shot{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.shot img{display:block;width:100%}
.shot .mk{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 6px rgba(0,0,0,.3);transform:translate(-50%,-50%)}
.legend{display:flex;flex-direction:column;gap:4px;margin:12px 0 14px;font-size:13px}
.legend .row{display:flex;gap:8px;align-items:baseline}
.legend .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--soft);color:var(--ink);font-weight:700;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.pick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pick .lb{font-size:12px;font-weight:700;color:var(--sub);width:110px;line-height:30px}
.chipbtn{font:inherit;font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.chipbtn.on-good{background:#DCFCE7;border-color:#86EFAC}
.chipbtn.on-bad{background:#FEE2E2;border-color:#FCA5A5}
textarea{font:inherit;font-size:13px;width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;box-sizing:border-box;resize:vertical}
.row{display:flex;align-items:center;gap:10px;margin-top:10px}
.save{font:inherit;font-weight:700;font-size:13px;height:34px;padding:0 18px;border-radius:8px;border:0;background:var(--acc);color:#fff;cursor:pointer}
.saved{font-size:12px;font-weight:600;color:var(--ok)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
</style>
<div class="wrap">
<h1>레퍼런스 — 어떤 걸 가져올까요</h1>
<p class="sub">앱마다 "가져오고 싶은 번호 / 싫은 번호 / 이유"만 답해주세요. 전체를 따라 하지 않습니다 — 일부만 가져옵니다.</p>
<div id="refs"></div>
</div>
<div id="toast"></div>
<script>
const CIRCLE="①②③④⑤⑥⑦⑧⑨⑩";
const REFS=[
{id:"aside",name:"Aside",img:"references/aside.png",why:"AI 에이전트 브라우저. 아이콘 레일+북마크/채팅/탭 사이드바 + 중앙 Ask 입력 + 최근 작업 카드 — Push 셸의 직접적 참고 원형",
 marks:[
  {x:12,y:53,t:"아이콘 레일 + 북마크/채팅/탭 섹션 사이드바"},
  {x:56,y:70,t:"중앙 Ask 입력창 — Search/Ask 버튼이 입력 안에"},
  {x:60,y:79,t:"입력 아래 컨텍스트 행 (Local/Guard/모델 선택)"},
  {x:62,y:89,t:"최근 작업 카드 — 진행 상태+단계 표시"},
  {x:12,y:87,t:"채팅 목록에 실행 상태 점"}]},
{id:"paseo",name:"Paseo",img:"references/paseo.png",why:"코딩 에이전트 컨트롤 플레인. 워크스페이스 사이드바 + 에이전트 탭 + 우측 파일/변경 패널 — 프로젝트 실행 화면 참고",
 marks:[
  {x:12,y:82,t:"워크스페이스 사이드바 (Pinned/Workspaces 그룹)"},
  {x:42,y:66,t:"에이전트·프로세스 탭 바 (Codex/Claude Code/npm run dev)"},
  {x:83,y:80,t:"우측 Files·Changes 패널 — 변경 파일 트리+diff 수치"},
  {x:62,y:58,t:"상단 모드 세그먼트 (Build/Review/Ship/Extend)"}]},
{id:"chatgpt",name:"ChatGPT",img:"references/chatgpt.png",why:"채팅 중심 홈. 사이드바 최근 채팅 + 중앙 입력 + 입력 아래 제안 행 — Push 홈 구조와 가장 유사",
 marks:[
  {x:12,y:70,t:"사이드바 최근 채팅 리스트 (채팅 목록 평면 나열)"},
  {x:58,y:44,t:"중앙 큰 입력창 — 첨부·모드·마이크가 입력 안에"},
  {x:45,y:56,t:"입력 아래 제안 액션 행 (아이콘+짧은 문구)"},
  {x:60,y:4,t:"상단 Chat/Work 모드 토글"},
  {x:9,y:10,t:"사이드바 상단 액션 (새 채팅·검색·라이브러리)"}]},
{id:"grok",name:"Grok",img:"references/grok.png",why:"AI 에이전트 데스크톱형 UI. 사이드바를 기능 섹션으로 나누고 프로젝트를 별도 섹션으로 둠",
 marks:[
  {x:10,y:18,t:"사이드바 기능 섹션 구분 (채팅/Imagine/라이브러리/자동화)"},
  {x:11,y:30,t:"프로젝트 섹션 + '프로젝트 추가' 버튼"},
  {x:58,y:37,t:"중앙 입력창 — 내부에 +·모드·마이크"},
  {x:9,y:91,t:"사이드바 하단 플러그인·계정"},
  {x:88,y:4,t:"우상단 모델/모드 표시"}]},
{id:"notion",name:"Notion",img:"references/notion.png",why:"문서 작업 공간. 워크스페이스 네비 + 상태 칸반 — 지원 관리 보드 참고",
 marks:[
  {x:22,y:72,t:"좌측 워크스페이스 네비 (검색/홈/에이전트 섹션)"},
  {x:55,y:82,t:"상태 칸반 컬럼 — 카드에 담당·상태 태그"},
  {x:48,y:61,t:"상단 뷰 탭 (회사 작업/내 작업/스프린트)"},
  {x:22,y:80,t:"에이전트 목록 섹션"}]},
{id:"linear",name:"Linear Docs",img:"references/linear-docs.png",why:"다크 문서 허브. 접이식 트리 네비 + 섹션별 카드 그리드",
 marks:[
  {x:9,y:40,t:"접이식 트리 사이드바"},
  {x:48,y:42,t:"섹션 헤더 + 아이콘 카드 그리드"},
  {x:52,y:49,t:"카드 = 아이콘 + 제목 + 한 줄 설명"}]},
{id:"craft",name:"Craft",img:"references/craft.png",why:"문서 카드 중심 편집기. 컬러 카드로 문서를 구분 — 내 서류 목록 참고",
 marks:[
  {x:60,y:80,t:"컬러 문서 카드 그리드 — 색으로 문서 구분"},
  {x:26,y:78,t:"미니 사이드바 (All Docs/Tasks/Calendar + Starred)"},
  {x:60,y:64,t:"상단 얇은 툴바 + 검색"}]},
];

const $=(s,r=document)=>r.querySelector(s);
const LS='push-hubdb';
let db=null;if(window.claude&&claude.use)claude.use('db').then(d=>db=d);
function load(){try{return JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){return{}}}
function save(k,v){const a=load();a['feedback/ref-'+k]=Object.assign({},v,{updatedAt:new Date().toISOString()});localStorage.setItem(LS,JSON.stringify(a));if(db)db.doc('feedback/ref-'+k).set(a['feedback/ref-'+k])}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2000)}
function fmtAgo(iso){const d=(Date.now()-new Date(iso).getTime())/1000;if(d<60)return'방금';if(d<3600)return Math.floor(d/60)+'분 전';return new Date(iso).toLocaleDateString('ko-KR')}

const D={};
REFS.forEach(r=>{D[r.id]={good:[],bad:[],text:''}});
const saved=load();
REFS.forEach(r=>{const s=saved['feedback/ref-'+r.id];if(s){D[r.id]={good:s.good||[],bad:s.bad||[],text:s.text||''}}});

function build(){
 $('#refs').innerHTML=REFS.map(r=>`
 <div class="ref" data-id="${r.id}">
  <h2>${r.name}</h2>
  <div class="why">왜 골랐는지 — ${r.why}</div>
  <div class="shot"><img src="${r.img}" alt="${r.name}">
   ${r.marks.map((m,i)=>`<div class="mk" style="left:${m.x}%;top:${m.y}%" title="${m.t}">${CIRCLE[i]}</div>`).join('')}
  </div>
  <div class="legend">${r.marks.map((m,i)=>`<div class="row"><span class="n">${CIRCLE[i]}</span><span>${m.t}</span></div>`).join('')}</div>
  <div class="pick"><span class="lb">가져오고 싶은 것</span>${r.marks.map((m,i)=>`<button class="chipbtn" data-g="${i}">${CIRCLE[i]}</button>`).join('')}</div>
  <div class="pick"><span class="lb">싫은 것</span>${r.marks.map((m,i)=>`<button class="chipbtn" data-b="${i}">${CIRCLE[i]}</button>`).join('')}</div>
  <textarea data-text placeholder="이유를 짧게 (비워도 됩니다)"></textarea>
  <div class="row"><button class="save">저장</button><span class="saved"></span></div>
 </div>`).join('');
 REFS.forEach(renderRef);
}
function renderRef(r){
 const el=$(`.ref[data-id="${r.id}"]`),d=D[r.id];
 el.querySelectorAll('[data-g]').forEach(b=>b.classList.toggle('on-good',d.good.includes(+b.dataset.g)));
 el.querySelectorAll('[data-b]').forEach(b=>b.classList.toggle('on-bad',d.bad.includes(+b.dataset.b)));
 const ta=$('[data-text]',el);if(document.activeElement!==ta)ta.value=d.text;
 const s=load()['feedback/ref-'+r.id];
 $('.saved',el).textContent=s?`저장됨 ✓ ${fmtAgo(s.updatedAt)}`:'';
}
$('#refs').addEventListener('click',e=>{
 const g=e.target.closest('[data-g]'),b=e.target.closest('[data-b]'),sv=e.target.closest('.save');
 if(g||b){const el=e.target.closest('.ref'),r=REFS.find(x=>x.id===el.dataset.id),d=D[r.id];
  const arr=g?d.good:d.bad,i=+(g||b).dataset[g?'g':'b'];
  const j=arr.indexOf(i);j<0?arr.push(i):arr.splice(j,1);renderRef(r);return}
 if(sv){const el=sv.closest('.ref'),r=REFS.find(x=>x.id===el.dataset.id);
  D[r.id].text=$('[data-text]',el).value;
  save(r.id,{app:r.name,good:D[r.id].good.map(i=>CIRCLE[i]),bad:D[r.id].bad.map(i=>CIRCLE[i]),goodNames:D[r.id].good.map(i=>r.marks[i].t),badNames:D[r.id].bad.map(i=>r.marks[i].t),text:D[r.id].text});
  renderRef(r);toast(r.name+' 의견 저장됨')}
});
build();
</script>
