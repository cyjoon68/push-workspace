<meta charset="utf-8"><title>취향 시안 — 글자</title>
<style>
:root{color-scheme:light only;--bg:#F7F8FA;--card:#FFFFFF;--line:#E5E7EB;--ink:#1F2937;--sub:#6B7280;--acc:#2F6BFF;--frame-w:1440px}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Pretendard",-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 80px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--sub);font-size:13px;margin-bottom:26px}
h2{font-size:16px;margin:0 0 4px}
.plain{color:var(--sub);font-size:12px;margin-bottom:4px}
.reco{color:var(--acc);font-size:13px;font-weight:600;margin-bottom:14px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
figure{margin:0;cursor:pointer}
figure .lab{text-align:center;font-weight:700;margin-top:8px;color:var(--sub)}
figure.sel .lab{color:var(--acc)}
.win{border-radius:10px;overflow:hidden;border:2px solid transparent;box-shadow:0 2px 10px rgba(0,0,0,.08)}
figure.sel .win{border-color:var(--acc);box-shadow:0 0 0 3px rgba(47,107,255,.2)}
.tb{display:flex;gap:5px;padding:8px 10px;background:#F5F5F7;border-bottom:1px solid #E5E7EB}
.tb i{width:8px;height:8px;border-radius:50%;background:#E5E7EB}
.wb{display:flex;background:#fff;color:#111827;min-height:280px}
.sb{width:110px;flex:none;border-right:1px solid #E5E7EB;background:#F5F5F7;padding:10px 8px;font-size:11px;display:flex;flex-direction:column}
.sb .sec{font-size:9px;font-weight:700;color:#6B7280;padding:6px 6px 2px}
.sb .it{padding:4px 6px;border-radius:5px;color:#6B7280;font-size:10px}
.sb .it.on{background:#EFF4FF;color:#2563EB;font-weight:600}
.cv{flex:1;padding:22px 18px}
.h{margin-bottom:12px}
.cmd{border:1px solid #E5E7EB;background:#F5F5F7;border-radius:9px;padding:8px 10px;font-size:11px;color:#6B7280;display:flex;align-items:center;gap:8px}
.cmd .go{margin-left:auto;background:#2563EB;color:#fff;font-weight:700;font-size:10px;padding:4px 10px;border-radius:6px}
.rl{font-weight:700;color:#6B7280;margin:16px 0 6px}
.gd{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.gc{border:1px solid #E5E7EB;border-radius:8px;padding:8px}
.gc .d{color:#6B7280}
/* axis5 타이포 */
.va .h{font-size:15px;font-weight:700}
.va .rl,.va .gc .t{font-size:10px;font-weight:700}
.va .gc .d{font-size:9px}
.vb .h{font-size:22px;font-weight:800;letter-spacing:-.02em}
.vb .rl,.vb .gc .t{font-size:11px;font-weight:800}
.vb .gc .d{font-size:9px;font-weight:400}
.vc .h{font-family:"Noto Serif KR","Apple SD Gothic Neo",serif;font-size:18px;font-weight:700}
.vc .rl,.vc .gc .t{font-size:10px;font-weight:700}
.vc .gc .d{font-size:9px}
</style>
<div class="wrap">
<h1>글자</h1>
<p class="sub">마음에 드는 화면을 누르면 저장됩니다.</p>

<section data-axis="5">
<h2>타이포 성격</h2>
<p class="plain">제목·본문 글자 느낌 — 균일한 / 대비 강한 / 제목만 명조</p>
<p class="reco">추천: A — 긴 문서·채팅을 읽는 앱이라 균일한 산세리프가 무난</p>
<div class="row" id="r5"><figure data-ax="5" data-v="A"><div class="va" data-fill></div><div class="lab">A</div></figure><figure data-ax="5" data-v="B"><div class="vb" data-fill></div><div class="lab">B</div></figure><figure data-ax="5" data-v="C"><div class="vc" data-fill></div><div class="lab">C</div></figure></div>
</section>
</div>
<script>
const W=()=>`<div class="win"><div class="tb"><i></i><i></i><i></i></div>
<div class="wb"><div class="sb">
<div class="sec">③ 기능</div><div class="it">내 서류</div><div class="it">지원 관리</div><div class="it">커리어 볼트</div>
<div class="sec">④ 채팅</div><div class="it on">카카오 · 백엔드</div><div class="it">네이버 · 플랫폼</div><div class="it">Kafka 파이프라인</div><div style="flex:1"></div><div class="it">⑤ 설정</div>
</div><div class="cv">
<div class="h">무엇을 도와드릴까요?</div>
<div class="cmd"><b style="color:var(--vacc,#2563EB)">①</b> 공고 링크를 붙여넣으세요<span class="go">실행</span></div>
<div class="rl">② 최근 작업</div>
<div class="gd"><div class="gc"><div class="t">카카오 백엔드 분석</div><div class="d">어제</div></div><div class="gc"><div class="t">자소서 초안 v2</div><div class="d">2일 전</div></div><div class="gc"><div class="t">네이버 공고 수집</div><div class="d">3일 전</div></div></div>
</div></div></div>`;
document.querySelectorAll('[data-fill]').forEach(el=>el.innerHTML=W());
const $=(s,r=document)=>r.querySelector(s);
const LS='push-hubdb';
function load(){try{return JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){return{}}}
let db=null;if(window.claude&&claude.use)claude.use('db').then(d=>db=d);
const saved=load();
document.addEventListener('click',e=>{
 const f=e.target.closest('figure[data-ax]');if(!f)return;
 f.parentElement.querySelectorAll('figure').forEach(x=>x.classList.toggle('sel',x===f));
 const a=load();a['feedback/axis-'+f.dataset.ax]={pick:f.dataset.v,updatedAt:new Date().toISOString()};
 localStorage.setItem(LS,JSON.stringify(a));if(db)db.doc('feedback/axis-'+f.dataset.ax).set(a['feedback/axis-'+f.dataset.ax]);
});
{const s=saved['feedback/axis-5'];if(s&&s.pick)$(`figure[data-ax="5"][data-v="${s.pick}"]`)?.classList.add('sel')}
</script>
