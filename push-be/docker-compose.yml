services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: push
      POSTGRES_PASSWORD: push
      POSTGRES_DB: push
    ports:
      - "5434:5432"
    volumes:
      - push-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U push -d push"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  push-pgdata:
