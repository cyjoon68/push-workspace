[package]
name = "push"
version = "0.1.0"
description = "Push — 채팅으로 지원·문서·프로젝트를 관리하는 데스크톱 앱"
authors = ["push"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "push_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-deep-link = "2.4.10"
